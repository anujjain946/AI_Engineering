<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}MovieManagement{% endblock %}</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f5f6fa; color:#222; }
        .nav { background:#172033; padding:14px 24px; color:#fff; display:flex; align-items:center; gap:22px; }
        .nav a { color:#fff; text-decoration:none; }
        .brand { font-weight:bold; margin-right:auto; }
        .container { max-width:1100px; margin:35px auto; padding:0 20px; }
        .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 10px #00000012; }
        .btn { display:inline-block; padding:10px 15px; border-radius:7px; background:#172033; color:#fff; text-decoration:none; border:0; cursor:pointer; }
        .error { color:#b00020; margin-bottom:12px; }
        input { width:100%; padding:11px; box-sizing:border-box; margin:7px 0 15px; border:1px solid #ddd; border-radius:6px; }
        ul { line-height:2; }
    </style>
</head>
<body>
    {% if request.user.is_authenticated %}
    <div class="nav">
        <a class="brand" href="{% url 'dashboard' %}">MovieManagement</a>
        {% for item, children in dynamic_menu_items %}
            <a href="{% url item.url_name %}">{{ item.name }}</a>
        {% endfor %}
        {% if request.user.is_staff %}
            <a href="/admin/">Admin</a>
        {% endif %}
        <a href="{% url 'logout' %}">Logout</a>
    </div>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
