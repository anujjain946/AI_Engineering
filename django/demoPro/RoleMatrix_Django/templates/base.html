<!doctype html><html><head><meta charset="utf-8"><title>RoleMatrix</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}.top{height:60px;background:#17202a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.layout{display:flex;min-height:calc(100vh - 60px)}.side{width:220px;background:#fff;padding:20px;box-shadow:2px 0 8px #ddd}.side a{display:block;padding:12px;text-decoration:none;color:#333;border-radius:6px}.side a:hover{background:#eee}.main{padding:30px;flex:1}.card{background:#fff;padding:25px;border-radius:10px;box-shadow:0 2px 8px #ddd;margin-bottom:20px}.btn{padding:9px 15px;background:#3498db;color:#fff;text-decoration:none;border-radius:5px;border:0}
</style></head><body>{% if user.is_authenticated %}<div class="top"><b>RoleMatrix Admin Dashboard</b><span>{{ user.email }} | {{ user.role.name|default:"Superuser" }} &nbsp; <a class="btn" href="/logout/">Logout</a></span></div><div class="layout"><aside class="side">{% for label,url in menu %}<a href="{{url}}">{{label}}</a>{% empty %}<p>No menu permissions.</p>{% endfor %}</aside><main class="main">{% block content %}{% endblock %}</main></div>{% else %}{% block public %}{% endblock %}{% endif %}</body></html>
