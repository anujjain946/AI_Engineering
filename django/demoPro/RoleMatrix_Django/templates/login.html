{% extends "base.html" %}{% block public %}<div style="max-width:400px;margin:100px auto"><div class="card"><h2>Login</h2>{% for message in messages %}<p style="color:red">{{message}}</p>{% endfor %}<form method="post">{% csrf_token %}<p><label>Email</label><input name="email" type="email" required style="width:100%;padding:10px"></p><p><label>Role</label><select name="role" required style="width:100%;padding:10px">{% for role in roles %}<option value="{{role.slug}}">{{role.name}}</option>{% endfor %}</select></p><p><label>Password</label><input name="password" type="password" required style="width:100%;padding:10px"></p><button class="btn">Login</button></form></div></div>{% endblock %}
